title: Mailbox Forwarding Rule Created
id: a13a04cc-f99c-4d2d-9882-387a3185fb44
status: test
description: >
  Detects creation of a mailbox forwarding rule in synthetic email
  telemetry. External forwarding should receive additional scrutiny
  during account takeover and BEC investigations.
author: Kyle Versluis
date: 2026-11-03

logsource:
  product: financial_security_incident_lab
  service: synthetic_mail
  definition: Synthetic ECS-style email events generated by this lab.

detection:
  selection:
    "event.action": mailbox_forwarding_rule_created
    "event.outcome": success
  condition: selection

tags:
  - attack.collection
  - attack.t1114.003

falsepositives:
  - Legitimate user-created forwarding
  - Approved administrative mailbox configuration
  - Authorized mail-routing workflows

level: high
