title: Synthetic Authentication Failure
name: synthetic_authentication_failure
id: 8dcf7ef1-41fa-4db8-bc5e-8525eedadbb3
status: test
description: >
  Identifies failed authentication events in the synthetic financial
  security incident dataset.
author: Kyle Versluis
date: 2026-11-03

logsource:
  product: financial_security_incident_lab
  service: synthetic_identity
  definition: Synthetic ECS-style authentication events generated by this lab.

detection:
  selection:
    "event.action": user_login
    "event.outcome": failure
  condition: selection

falsepositives:
  - Normal authentication failures
  - Users entering incorrect credentials

level: informational

---
title: Password Spray Against Multiple User Accounts
id: b1e54511-c738-46f6-92d8-bef79941eb45
status: test
description: >
  Detects failed authentication attempts from one source IP against
  four or more distinct user identities within ten minutes.
author: Kyle Versluis
date: 2026-11-03

correlation:
  type: value_count
  rules:
    - synthetic_authentication_failure
  group-by:
    - source.ip
  timespan: 10m
  condition:
    gte: 4
    field: user.email

tags:
  - attack.credential_access
  - attack.t1110.003

falsepositives:
  - Shared authentication gateways
  - Misconfigured applications
  - Security testing or authorized password audits

level: medium
